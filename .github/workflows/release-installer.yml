name: Build and Release Installer

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override for manual non-tag runs (e.g. 1.2.3-rc.1)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build mode and sync installer metadata
        id: meta
        shell: pwsh
        run: |
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"
          $runNumber = "${{ github.run_number }}"
          $manualVersion = "${{ github.event.inputs.version }}"
          $branchSlug = ([regex]::Replace($refName.ToLowerInvariant(), '[^0-9a-z]+', '-')).Trim('-')
          if ([string]::IsNullOrWhiteSpace($branchSlug)) {
            $branchSlug = "ci"
          }

          $isRelease = $false
          $version = $null
          $releaseTag = ''

          $issPath = Join-Path $PWD 'installer\installer.iss'
          $issContent = Get-Content -Path $issPath -Raw
          $appVersionMatch = [regex]::Match($issContent, '(?m)^AppVersion=(.+)$')
          if (-not $appVersionMatch.Success) {
            throw "Could not find AppVersion=... in installer.iss"
          }
          $baseVersion = $appVersionMatch.Groups[1].Value.Trim()

          if ($baseVersion -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z\.]+)?$') {
            throw "Base AppVersion '$baseVersion' in installer.iss is invalid."
          }

          if (($refType -eq 'tag') -and $refName.StartsWith('v')) {
            $isRelease = $true
            $releaseTag = $refName
            $version = $refName.Substring(1)
          }
          elseif (-not [string]::IsNullOrWhiteSpace($manualVersion)) {
            $version = $manualVersion
          }
          else {
            # Branch CI builds inherit the repo AppVersion and add deterministic prerelease metadata.
            $version = "$baseVersion-ci.$runNumber"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z\.]+)?$') {
            throw "Version '$version' is invalid. Expected <major>.<minor>.<patch> with optional suffix (example: 1.2.3-rc.1)."
          }

          $updatedContent = [regex]::Replace($issContent, '(?m)^AppVersion=.*$', "AppVersion=$version")
          if ($updatedContent -eq $issContent) {
            throw "Could not find AppVersion=... in installer.iss"
          }
          Set-Content -Path $issPath -Value $updatedContent -Encoding ascii

          "version=$version" >> $env:GITHUB_OUTPUT
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "branch_slug=$branchSlug" >> $env:GITHUB_OUTPUT

      - name: Compile Inno Setup script
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/installer.iss

      - name: Resolve version and artifact paths
        id: vars
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $isRelease = "${{ steps.meta.outputs.is_release }}" -eq "true"
          $branchSlug = "${{ steps.meta.outputs.branch_slug }}"

          $searchRoots = @("Output", "installer/Output")
          $builtExe = Get-ChildItem -Path $searchRoots -Filter "*.exe" -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $builtExe) {
            $checkedRoots = $searchRoots -join ", "
            throw "No installer executable found. Checked: $checkedRoots"
          }

          if ($isRelease) {
            $releaseExe = "OdysseusSetup-$version.exe"
          }
          else {
            $releaseExe = "OdysseusSetup-$version-$branchSlug.exe"
          }
          $releaseExePath = Join-Path $PWD $releaseExe
          Copy-Item -Path $builtExe.FullName -Destination $releaseExePath -Force

          $hash = (Get-FileHash -Path $releaseExePath -Algorithm SHA256).Hash.ToLower()
          $hashFile = "$releaseExe.sha256"
          "$hash  $releaseExe" | Set-Content -Path $hashFile -Encoding ascii

          $isPrerelease = if ($version -match "-(alpha|beta|rc)(\.|\d|$)") { "true" } else { "false" }

          "version=$version" >> $env:GITHUB_OUTPUT
          "release_exe=$releaseExe" >> $env:GITHUB_OUTPUT
          "release_sha=$hashFile" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Upload CI artifacts
        if: steps.meta.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: odysseus-installer-${{ steps.vars.outputs.version }}-${{ steps.meta.outputs.branch_slug }}
          path: |
            ${{ steps.vars.outputs.release_exe }}
            ${{ steps.vars.outputs.release_sha }}

      - name: Create GitHub release and upload assets
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          prerelease: ${{ steps.vars.outputs.prerelease }}
          files: |
            ${{ steps.vars.outputs.release_exe }}
            ${{ steps.vars.outputs.release_sha }}
